name: Build Windows Download

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform
        run: flutter create . --platforms=windows --project-name oraculo_diosa_fortuna --org com.primeinnovationthinking

      - name: Remove generated widget test
        shell: pwsh
        run: |
          if (Test-Path "test/widget_test.dart") {
            Remove-Item "test/widget_test.dart" -Force
          }

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath Oraculo_Diosa_Fortuna_Windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Diosa-Fortuna-Windows
          path: Oraculo_Diosa_Fortuna_Windows.zip

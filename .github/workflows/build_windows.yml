name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: flutter create . --platforms=windows,android

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\oraculo_installer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Diosa-Fortuna-Setup
          path: installer/output/Oraculo_Diosa_Fortuna_Setup.exe

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Diosa-Fortuna-Windows-Portable
          path: build/windows/x64/runner/Release/

name: oraculo_diosa_fortuna
description: Plataforma estadística multiplataforma para Melate Retro.
publish_to: "none"
version: 1.2.3+123

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  shared_preferences: ^2.3.2
  pdf: ^3.13.0
  printing: ^5.15.0
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/historico_retro.csv
    - assets/config/model_config.json
    - assets/images/oraculo_logo.png
    - assets/images/pit_powered_by.png

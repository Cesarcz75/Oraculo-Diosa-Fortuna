name: Build Web

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: flutter create . --platforms=windows,android,web

      - name: Get dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Package web build
        run: tar -czf Oraculo_Diosa_Fortuna_Web.tar.gz -C build/web .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Diosa-Fortuna-Web
          path: Oraculo_Diosa_Fortuna_Web.tar.gz
